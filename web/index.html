<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HeyLane | Enterprise Distribution & Retail Network</title>

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FAF8F2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HeyLane" />
  <link rel="icon" type="image/svg+xml" href="/assets/brand/HeyLane-Symbol.svg" />
  <link rel="apple-touch-icon" href="/assets/brand/HeyLane-Symbol.svg" />

  <!-- Fonts: Inter is the authentic HeyLane typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;750;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.log('SW registration error:', err);
        });
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
