name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: retailer_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Generate Prisma client
        run: npx --prefix backend prisma generate

      - name: Push Prisma Schema to test DB
        run: npx --prefix backend prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/retailer_test_db?schema=public

      - name: Run backend TypeScript build
        run: npm --prefix backend run build

      - name: Run backend Jest test suite
        run: npm --prefix backend test
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/retailer_test_db?schema=public
          JWT_SECRET: test-jwt-secret-key-1234567890

  frontend-build:
    name: Mobile/Web Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Export Web bundle
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:5000

