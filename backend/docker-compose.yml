version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: retailer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retailer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retailer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailer_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/retailer_db?schema=public
      PORT: 5000
      JWT_SECRET: super-secret-jwt-key-retailer-onboarding-2026
      ADMIN_SEED_USERNAME: admin
      ADMIN_SEED_PASSWORD: AdminPassword@123
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:
    driver: local
