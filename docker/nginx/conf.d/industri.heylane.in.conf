# Upstream Node.js Backend API
upstream backend_api {
    server api:5000;
    keepalive 32;
}

# ----------------------------------------------------------------------
# 1. HTTP Server - Port 80 (Certbot ACME + HTTP Traffic / Redirect)
# ----------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name industri.heylane.in www.industri.heylane.in localhost _;

    # Let's Encrypt automated SSL renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect to HTTPS if request header indicates HTTP in production SSL environments
    # (Or keep serving proxy if SSL not yet forced)
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin Web Portal (/admin/)
    location ^~ /admin/ {
        alias /var/www/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;

        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Redirect /admin without trailing slash to /admin/
    location = /admin {
        return 301 $scheme://$http_host/admin/;
    }

    # Staff / Seller Web PWA App (Root /)
    location / {
        root /var/www/html/seller;
        try_files $uri $uri/ /index.html;
        index index.html;

        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}

# ----------------------------------------------------------------------
# 2. HTTPS Server - Port 443 (Full TLS 1.2 / 1.3 Encryption)
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name industri.heylane.in www.industri.heylane.in;

    # SSL Certificates (Provided by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/industri.heylane.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/industri.heylane.in/privkey.pem;

    # SSL Security Configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (Enable after verifying SSL is working)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # API Proxy to Node.js backend
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Admin Web Portal (/admin/)
    location ^~ /admin/ {
        alias /var/www/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        index index.html;

        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Redirect /admin without trailing slash to /admin/
    location = /admin {
        return 301 https://$http_host/admin/;
    }

    # Staff / Seller Web PWA App (Root /)
    location / {
        root /var/www/html/seller;
        try_files $uri $uri/ /index.html;
        index index.html;

        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}

# ----------------------------------------------------------------------
# 3. Dedicated Admin Subdomain (Optional support: admin.industri.heylane.in)
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.industri.heylane.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend_api/health;
    }

    location / {
        root /var/www/html/admin;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}

