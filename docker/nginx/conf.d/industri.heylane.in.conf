server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name industri.heylane.in www.industri.heylane.in admin.industri.heylane.in localhost _;
    root /var/www/html/pwa;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name industri.heylane.in www.industri.heylane.in;
    root /var/www/html/pwa;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/industri.heylane.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/industri.heylane.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
