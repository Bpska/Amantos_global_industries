services:
  postgres:
    image: postgres:16-alpine
    container_name: industri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bps
      POSTGRES_DB: retailer_db
    ports:
      - "${DB_HOST_PORT:-2346}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retailer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: industri_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-4898}:5000"
    environment:
      DATABASE_URL: postgresql://postgres:bps@postgres:5432/retailer_db?schema=public
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: industri-jwt-production-secret-token-key-2026-heylane
      ADMIN_SEED_USERNAME: admin
      ADMIN_SEED_PASSWORD: admin@123
      CORS_ORIGIN: "*"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: industri_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8012}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
    name: industri_pgdata
  certbot_conf:
    name: industri_certbot_conf
  certbot_www:
    name: industri_certbot_www
