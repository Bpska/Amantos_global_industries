services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Enterprise Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: industri_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-industri_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-retailer_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5441}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-retailer_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - industri_net

  # ----------------------------------------------------------------------------
  # 2. Node.js Backend API Service (Express + Prisma ORM)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industri_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-industri_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-retailer_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-industri-jwt-production-secret-token-key-2026}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-admin}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-AdminPassword@123}
      CORS_ORIGIN: https://industri.heylane.in,http://industri.heylane.in,https://www.industri.heylane.in,https://admin.industri.heylane.in
    expose:
      - "5000"
    ports:
      - "${API_PORT:-5007}:5000"
    networks:
      - industri_net

  # ----------------------------------------------------------------------------
  # 3. Web Gateway: Nginx Reverse Proxy + Frontends (Admin & Seller Web Panels)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: industri_web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8012}:80"
      - "${SSL_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-industri.heylane.in}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - industri_net

  # ----------------------------------------------------------------------------
  # 4. Certbot SSL Automated Renewal Bot (Let's Encrypt)
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: industri_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - industri_net

volumes:
  pgdata:
    name: industri_pgdata
  certbot_conf:
    name: industri_certbot_conf
  certbot_www:
    name: industri_certbot_www

networks:
  industri_net:
    name: industri_network
    driver: bridge
